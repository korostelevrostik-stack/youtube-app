<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube Shorts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: white; font-family: system-ui; overflow: hidden; height: 100vh; }
    .container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; scroll-behavior: smooth; }
    .short { 
      height: 100vh; 
      scroll-snap-align: start; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      position: relative; 
      background: #0a0a0a; 
    }
    .short iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      position: absolute; 
      top: 0; 
      left: 0; 
    }
    .short-info { 
      position: absolute; 
      bottom: 80px; 
      left: 20px; 
      z-index: 10; 
      text-shadow: 0 2px 10px rgba(0,0,0,0.8); 
    }
    .short-title { font-size: 16px; font-weight: bold; max-width: 80%; }
    .short-channel { font-size: 13px; color: #aaa; margin-top: 4px; }
    .controls { 
      position: fixed; 
      bottom: 30px; 
      left: 50%; 
      transform: translateX(-50%); 
      z-index: 20; 
      display: flex; 
      gap: 40px; 
      background: rgba(0,0,0,0.6); 
      padding: 12px 30px; 
      border-radius: 30px; 
      backdrop-filter: blur(10px); 
    }
    .controls button { 
      background: none; 
      border: none; 
      color: white; 
      font-size: 28px; 
      cursor: pointer; 
      padding: 0 10px; 
    }
    .loading { 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      color: #666; 
      font-size: 20px; 
      flex-direction: column;
      gap: 20px;
    }
    .loader {
      width: 40px;
      height: 40px;
      border: 4px solid #333;
      border-top: 4px solid #ff0000;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .back-btn { 
      position: fixed; 
      top: 20px; 
      left: 20px; 
      z-index: 30; 
      background: rgba(0,0,0,0.5); 
      color: white; 
      border: none; 
      border-radius: 50%; 
      width: 44px; 
      height: 44px; 
      font-size: 22px; 
      cursor: pointer; 
      backdrop-filter: blur(10px); 
    }
    .error { text-align: center; padding: 20px; color: #ff4444; }
    .video-counter {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 30;
      background: rgba(0,0,0,0.5);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      color: #aaa;
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='/'">←</button>
<div class="video-counter" id="counter">1 / 30</div>
<div id="shorts-container" class="container"></div>
<div class="controls">
  <button onclick="prevShort()">⬆</button>
  <button onclick="nextShort()">⬇</button>
</div>

<script>
  let shortsData = [], currentIndex = 0;
  let isPlaying = false;
  const API_URL = window.location.origin;

  async function loadShorts() {
    const container = document.getElementById('shorts-container');
    container.innerHTML = `
      <div class="loading">
        <div class="loader"></div>
        <span>⏳ Загружаем Shorts...</span>
      </div>
    `;
    
    try {
      const res = await fetch(`${API_URL}/shorts`);
      const data = await res.json();
      if (!data.items || data.items.length === 0) {
        container.innerHTML = '<div class="loading">😕 Коротких видео не найдено</div>';
        return;
      }
      shortsData = data.items.filter(item => item.id && item.id.videoId);
      container.innerHTML = '';
      renderAllShorts();
      // Автовоспроизведение первого видео
      setTimeout(() => playCurrent(), 300);
    } catch (e) {
      container.innerHTML = `<div class="loading">❌ Ошибка: ${e.message}</div>`;
    }
  }

  function renderAllShorts() {
    const container = document.getElementById('shorts-container');
    container.innerHTML = '';
    
    shortsData.forEach((item, index) => {
      const div = document.createElement('div');
      div.className = 'short';
      div.setAttribute('data-index', index);
      
      // Используем параметр для ускорения загрузки
      div.innerHTML = `
        <iframe 
          src="https://www.youtube.com/embed/${item.id.videoId}?autoplay=0&controls=0&rel=0&modestbranding=1&enablejsapi=1&origin=${window.location.origin}" 
          allow="autoplay; encrypted-media; fullscreen"
          loading="${index < 3 ? 'eager' : 'lazy'}"
          id="player-${item.id.videoId}"
        ></iframe>
        <div class="short-info">
          <div class="short-title">${item.snippet.title}</div>
          <div class="short-channel">📺 ${item.snippet.channelTitle}</div>
        </div>
      `;
      container.appendChild(div);
    });
  }

  function playCurrent() {
    const iframes = document.querySelectorAll('.short iframe');
    if (iframes.length === 0) return;
    
    // Останавливаем все
    iframes.forEach(iframe => {
      const src = iframe.src;
      if (src.includes('autoplay=1')) {
        iframe.src = src.replace('autoplay=1', 'autoplay=0');
      }
    });
    
    // Запускаем текущий с принудительным обновлением
    const currentIframe = iframes[currentIndex];
    if (currentIframe) {
      let src = currentIframe.src;
      if (src.includes('autoplay=0')) {
        src = src.replace('autoplay=0', 'autoplay=1');
      } else if (!src.includes('autoplay=')) {
        src += '&autoplay=1';
      } else {
        src = src.replace('autoplay=0', 'autoplay=1');
      }
      currentIframe.src = src;
      
      // Обновляем счетчик
      document.getElementById('counter').textContent = `${currentIndex + 1} / ${shortsData.length}`;
    }
  }

  function nextShort() {
    const container = document.getElementById('shorts-container');
    if (currentIndex < shortsData.length - 1) {
      currentIndex++;
      container.scrollTo({ top: currentIndex * window.innerHeight, behavior: 'smooth' });
      setTimeout(() => playCurrent(), 200);
    }
  }

  function prevShort() {
    if (currentIndex > 0) {
      currentIndex--;
      document.getElementById('shorts-container').scrollTo({ top: currentIndex * window.innerHeight, behavior: 'smooth' });
      setTimeout(() => playCurrent(), 200);
    }
  }

  // Отслеживаем скролл
  let scrollTimeout;
  document.getElementById('shorts-container').addEventListener('scroll', () => {
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
      const index = Math.round(window.scrollY / window.innerHeight);
      if (index !== currentIndex && index < shortsData.length) {
        currentIndex = index;
        playCurrent();
      }
    }, 150);
  });

  // Предзагрузка следующего видео
  function preloadNext() {
    const nextIndex = currentIndex + 1;
    if (nextIndex < shortsData.length) {
      const nextIframe = document.querySelector(`.short[data-index="${nextIndex}"] iframe`);
      if (nextIframe) {
        // Просто подгружаем без автоплея
        const src = nextIframe.src;
        if (!src.includes('autoplay=')) {
          nextIframe.src = src + '&autoplay=0';
        }
      }
    }
  }

  // Каждые 5 секунд предзагружаем следующее
  setInterval(preloadNext, 3000);

  // Запуск
  loadShorts();
</script>
</body>
</html>
